<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die Aufstellung, unter dem 84rem-Breakpoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/ui/styles/tokens.css">
<link rel="stylesheet" href="src/ui/styles/app.css">
<link rel="stylesheet" href="src/ui/styles/chrome.css">
<link rel="stylesheet" href="src/ui/styles/board.css">
<link rel="stylesheet" href="src/ui/styles/overlay.css">
<link rel="stylesheet" href="src/ui/styles/lineup.css">
<style>
  /* Mockup only: the game sets the root size from the fitted stage, which is
     off below this breakpoint, so the page is at the browser default here. */
  html, body { margin: 0; background: var(--color-app-bg); }
  .chrome__button[data-action="language"] { margin-left: auto; }
  a { color: var(--color-hint); }
  a:hover { color: var(--color-focus); }
</style>
</head>
<body>
<div class="app" style="align-content: start;">
  <div class="app__chrome">
    <p class="chrome__turn"></p>
    <button type="button" class="chrome__button" data-action="language" data-lang="de">English</button>
  </div>
</div>

<div class="overlay" data-screen="lineup" data-open="true">
  <div class="overlay__panel">
    <h2 class="overlay__title">Spieler oder Bot?</h2>
    <p class="overlay__text">Mindestens ein Sitz gehört einem Spieler. Ein Bot spielt einen ganzen Zug: Würfelkarte, Wurf, Zug und Skillkarten.</p>
    <div class="overlay__seats">
      <div class="overlay__seat" data-player="0" data-controller="human">
        <span class="overlay__seat-name">Spieler 1 (Rot)</span>
        <span class="overlay__seat-choice">
          <button type="button" class="overlay__button" data-action="controller" data-seat="0" data-value="human" aria-pressed="true">Spieler</button>
          <button type="button" class="overlay__button" data-action="controller" data-seat="0" data-value="bot" aria-pressed="false">Bot</button>
        </span>
      </div>
      <div class="overlay__seat" data-player="1" data-controller="human">
        <span class="overlay__seat-name">Spieler 2 (Gelb)</span>
        <span class="overlay__seat-choice">
          <button type="button" class="overlay__button" data-action="controller" data-seat="1" data-value="human" aria-pressed="true">Spieler</button>
          <button type="button" class="overlay__button" data-action="controller" data-seat="1" data-value="bot" aria-pressed="false">Bot</button>
        </span>
      </div>
      <div class="overlay__seat" data-player="2" data-controller="bot">
        <span class="overlay__seat-name">Bot 3 (Grün)</span>
        <span class="overlay__seat-choice">
          <button type="button" class="overlay__button" data-action="controller" data-seat="2" data-value="human" aria-pressed="false">Spieler</button>
          <button type="button" class="overlay__button" data-action="controller" data-seat="2" data-value="bot" aria-pressed="true">Bot</button>
        </span>
      </div>
      <div class="overlay__seat" data-player="3" data-controller="bot">
        <span class="overlay__seat-name">Bot 4 (Blau)</span>
        <span class="overlay__seat-choice">
          <button type="button" class="overlay__button" data-action="controller" data-seat="3" data-value="human" aria-pressed="false">Spieler</button>
          <button type="button" class="overlay__button" data-action="controller" data-seat="3" data-value="bot" aria-pressed="true">Bot</button>
        </span>
      </div>
    </div>
    <div class="overlay__actions">
      <button type="button" class="overlay__button" data-action="back">Zurück</button>
      <button type="button" class="overlay__button" data-action="begin" data-variant="primary">Spiel starten</button>
    </div>
  </div>
</div>
</body>
</html>
