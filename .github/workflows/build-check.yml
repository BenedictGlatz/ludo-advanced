# The five quality gates of section 6 of Test-Plan-and-Quality-Strategy.md, run by a machine instead
# of by discipline. Until this file existed, step 4 of the Definition of Done was an agreement:
# every gate worked, and every gate ran only when somebody remembered it.
#
# Reasons for the shape of this file are in notes/08-quality.md and project-journal.md. The three
# that get changed by accident most easily:
#
#   * `npm test` and `npm run test:coverage` run the same unit suite. That is deliberate, not an
#     oversight. Five steps map one to one onto the five named gates, and the duplication costs a
#     measured 2.45 s. Do not "clean it up" without changing the test plan first.
#   * The 80 % coverage floor of NFR-05 is not configured here. It lives in `vitest.config.js`,
#     where it also applies to a local run. CI runs the same command a developer runs.
#   * The `msedge` project of NFR-10 is missing on purpose. It drives the system Edge, which a Linux
#     runner does not have. It stays a local, once-per-release check.

name: build-check

on:
  pull_request:
    branches: [dev, main]
  # Manual runs, once this file is on the default branch. Useful for re-running a gate without
  # pushing an empty commit.
  workflow_dispatch:

# A second push to the same pull request cancels the first run instead of paying for both.
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

# This workflow reads the repository and writes nothing back to it.
permissions:
  contents: read

env:
  # Matches the version the team develops on. `package.json` declares `engines: ">=20"`, and that
  # floor is therefore checked by nothing. Recorded in notes/08-quality.md rather than papered over
  # with a version matrix this project has no use for: nothing here is published as a package.
  NODE_VERSION: "24"

jobs:
  # Gates 1 to 4. Finishes in a couple of minutes, which is the feedback you actually want on a
  # pull request.
  checks:
    name: lint, unit tests, coverage, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 - lint
        run: npm run lint

      - name: Gate 2 - unit tests
        run: npm test

      - name: Gate 3 - coverage against the NFR-05 floor
        run: npm run test:coverage

      - name: Gate 4 - production build
        run: npm run build

  # Gate 5. Runs only after `checks` is green: a broken lint rule should not cost a browser
  # download. One job per engine, and `fail-fast: false` so a failure on one engine still tells us
  # whether the other one is affected. That difference is the first question anyone asks.
  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.project }}

      # No build step here: the `webServer` block of playwright.config.js runs
      # `npm run build && npm run preview` itself, because the suite tests the production build
      # rather than the dev server. GitHub Actions sets CI=true, which also switches on
      # `forbidOnly` (a forgotten `test.only` fails the run), one retry and the HTML reporter.
      - name: Gate 5 - end-to-end suite
        run: npx playwright test --project=${{ matrix.project }}

      # Uploaded on success too, and that is the point. `retries: 1` means a test that failed once
      # and passed on the retry is reported as *flaky* rather than as a failure, so the run is green
      # and something is still wrong. That count is readable only in this report.
      - name: Upload the Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
